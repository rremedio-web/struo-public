name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4', '8.5']

    steps:
      # actions/checkout v5.0.0
      # Full history so the Gitleaks history scan sees every commit, not just HEAD.
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          fetch-depth: 0

      # shivammathur/setup-php 2.40.0 (commit object, not a tag SHA)
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # actions/setup-node v5.0.0 — PHP 8.2 owns Node syntax, npm lint, and zip drift.
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        if: matrix.php == '8.2'
        with:
          node-version: '20'

      - name: Verify Action pins resolve
        if: matrix.php == '8.2'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash tests/action-pins.sh --resolve .github/workflows/ci.yml

      - name: Shell syntax
        if: matrix.php == '8.2'
        run: |
          bash -n tests/smoke.sh
          bash -n tests/rest-probe.sh
          bash -n tests/action-pins.sh
          bash -n tests/gitleaks.sh
          bash -n tests/export-public-cases.sh
          bash -n bin/build-zip.sh
          bash -n bin/export-public.sh

      - name: Node syntax
        if: matrix.php == '8.2'
        run: |
          node --check assets/console.js
          node --check tests/autodetect-cases.mjs
          node tests/autodetect-cases.mjs

      - name: Work Queue build drift
        if: matrix.php == '8.2'
        run: |
          npm ci
          npm run build
          npm run lint
          npm test
          git diff --exit-code -- assets/work-queue.js assets/work-queue.asset.php assets/gutenberg-host.js assets/gutenberg-host.asset.php assets/console.js assets/console.css

      - name: Lint every PHP file
        run: >
          find . \
            -path ./.git -prune -o \
            -path ./vendor -prune -o \
            -path ./node_modules -prune -o \
            -path ./dist -prune -o \
            -type f -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Static smoke harness
        run: bash tests/smoke.sh

      - name: Composer install (dev deps)
        run: composer install --no-interaction --no-progress

      - name: Composer audit
        run: composer audit --no-interaction

      - name: Gitleaks history scan
        if: matrix.php == '8.2'
        run: bash tests/gitleaks.sh --history

      - name: Gitleaks working tree scan
        if: matrix.php == '8.2'
        run: bash tests/gitleaks.sh --no-git

      - name: PHPCS extracted modules (blocking)
        run: >
          vendor/bin/phpcs --standard=phpcs.xml.dist
          --runtime-set ignore_warnings_on_exit 1

      # Report-only until further struo.php splits. Do not remove
      # continue-on-error from this step onto the god class. Same ruleset
      # as the blocking step, summary output only, PHP 8.2 only.
      - name: PHPCS WordPress standard on struo.php (report-only)
        if: matrix.php == '8.2'
        continue-on-error: true
        run: >
          vendor/bin/phpcs -d memory_limit=1G --standard=phpcs.xml.dist
          --report=summary --report-source
          struo.php

  eval-lite:
    name: WordPress ${{ matrix.wp }} lite eval
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: struo
    strategy:
      fail-fast: false
      matrix:
        include:
          - wp: '6.9'
            config: .wp-env.json
          - wp: '7.1'
            config: .wp-env.7.1.json
    steps:
      # Checkout as struo/ so wp-env mounts wp-content/plugins/struo even
      # when the GitHub repository folder is named struo-public.
      # actions/checkout v5.0.0
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          path: struo

      # actions/setup-node v5.0.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '20'

      - name: Install wp-env
        run: npm install -g @wordpress/env@10.31.0

      # 10.31.0 has no --config. Passing --config=FILE makes yargs treat it
      # as the run container name, so every eval job exits immediately.
      - name: Use WordPress ${{ matrix.wp }} wp-env file
        if: ${{ matrix.config != '.wp-env.json' }}
        run: cp -- "${{ matrix.config }}" .wp-env.json

      - name: Start WordPress ${{ matrix.wp }}
        run: wp-env start

      - name: Run wp-eval-lite.php
        run: >
          wp-env run cli wp eval-file
          wp-content/plugins/struo/tests/wp-eval-lite.php
          --user=admin

  eval-full:
    name: WordPress ${{ matrix.wp }} full eval
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: struo
    strategy:
      fail-fast: false
      matrix:
        include:
          - wp: '6.9'
            config: .wp-env.json
          - wp: '7.1'
            config: .wp-env.7.1.json
    steps:
      # actions/checkout v5.0.0
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          path: struo

      # actions/setup-node v5.0.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '20'

      - name: Install wp-env
        run: npm install -g @wordpress/env@10.31.0

      - name: Use WordPress ${{ matrix.wp }} wp-env file
        if: ${{ matrix.config != '.wp-env.json' }}
        run: cp -- "${{ matrix.config }}" .wp-env.json

      - name: Start WordPress ${{ matrix.wp }}
        run: wp-env start

      - name: Run wp-eval-cases.php
        run: >
          wp-env run cli wp eval-file
          wp-content/plugins/struo/tests/wp-eval-cases.php
          --user=admin

  package:
    name: Release zip
    needs: [ ci, eval-lite, eval-full ]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # actions/checkout v5.0.0
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8

      # shivammathur/setup-php 2.40.0 (commit object, not a tag SHA)
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962
        with:
          php-version: '8.2'
          coverage: none
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build release zip
        run: bash bin/build-zip.sh

      - name: Gitleaks zip artifact
        run: |
          unzip -q -d /tmp/struo-zip-scan dist/struo-*.zip
          bash tests/gitleaks.sh --no-git --source /tmp/struo-zip-scan

      - name: Write and verify SHA-256 checksum
        run: |
          cd dist
          zip="$(ls struo-*.zip)"
          sha256sum "$zip" | tee "${zip}.sha256"
          sha256sum -c "${zip}.sha256"

      # actions/upload-artifact v6.0.0
      - name: Upload release zip artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: struo-release
          path: |
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error

      - name: Publish GitHub Release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/struo-*.zip dist/struo-*.sha256 \
              --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" dist/struo-*.zip dist/struo-*.sha256 \
              --repo "$GITHUB_REPOSITORY" \
              --title "Struo ${TAG#v}" \
              --notes "Agents may plan. Only a person applies. Fail-closed allowlists, durable plans, human approval, audit records, and provider protections."
          fi
